[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "efi-backend"
version = "0.1.0"
description = "Environmental Forensic Intelligence — Backend API"
requires-python = ">=3.13"
dependencies = [
    # ── Web Framework ──────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",

    # ── Database ───────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "geoalchemy2>=0.15.0",
    "psycopg2-binary>=2.9.10",

    # ── Job Queue ──────────────────────────────────────────────
    "arq>=0.26.1",
    "redis>=5.2.0",

    # ── Geospatial ─────────────────────────────────────────────
    "rasterio>=1.4.0",
    "shapely>=2.0.0",
    "pyproj>=3.7.0",
    "geopandas>=1.0.0",
    "numpy>=2.1.0",
    "scipy>=1.15.0",

    # ── HTTP Client ────────────────────────────────────────────
    "httpx>=0.28.0",
    "aiohttp>=3.11.0",
    "tenacity>=9.0.0",

    # ── Report Generation ──────────────────────────────────────
    "reportlab>=4.3.0",
    "jinja2>=3.1.0",

    # ── Utilities ─────────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "rich>=13.9.0",
    "click>=8.1.0",
    "orjson>=3.10.0",
    "uuid6>=2024.1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "factory-boy>=3.3.0",
    "faker>=33.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "migrations*"]

[tool.ruff]
line-length = 100
target-version = "py313"
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "SIM"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
