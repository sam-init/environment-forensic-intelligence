# ================================================================
# Environmental Forensic Intelligence — Docker Compose
# ================================================================
# Services:
#   db       — PostgreSQL 16 + PostGIS 3.4
#   redis    — Redis 7 (job queue + cache)
#   backend  — FastAPI (Python 3.13)
#   worker   — ARQ background worker
#   frontend — React + Vite dev server (Node 22)
# ================================================================

services:
  # ── PostgreSQL + PostGIS ─────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: efi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-efi_db}
      POSTGRES_USER: ${POSTGRES_USER:-efi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-efi_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-efi_user} -d ${POSTGRES_DB:-efi_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: efi_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI) ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: efi_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-efi_user}:${POSTGRES_PASSWORD:-efi_password}@db:5432/${POSTGRES_DB:-efi_db}
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=${APP_ENV:-development}
      - APP_SECRET_KEY=${APP_SECRET_KEY:-dev-secret-change-me}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DEMO_MODE=${DEMO_MODE:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - STORAGE_LOCAL_PATH=/app/data
      - PREPROCESSING_VERSION=${PREPROCESSING_VERSION:-v1.0.0}
      - RISK_CONFIG_PATH=/app/configs/risk_weights.json
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - COPERNICUS_USERNAME=${COPERNICUS_USERNAME:-}
      - COPERNICUS_PASSWORD=${COPERNICUS_PASSWORD:-}
      - COPERNICUS_STAC_URL=${COPERNICUS_STAC_URL:-https://stac.dataspace.copernicus.eu/v1}
    volumes:
      - ./backend:/app
      - ./configs:/app/configs:ro
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── Worker (ARQ background jobs) ─────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: efi_worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-efi_user}:${POSTGRES_PASSWORD:-efi_password}@db:5432/${POSTGRES_DB:-efi_db}
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=${APP_ENV:-development}
      - APP_SECRET_KEY=${APP_SECRET_KEY:-dev-secret-change-me}
      - DEMO_MODE=${DEMO_MODE:-true}
      - STORAGE_LOCAL_PATH=/app/data
      - PREPROCESSING_VERSION=${PREPROCESSING_VERSION:-v1.0.0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - COPERNICUS_USERNAME=${COPERNICUS_USERNAME:-}
      - COPERNICUS_PASSWORD=${COPERNICUS_PASSWORD:-}
    volumes:
      - ./backend:/app
      - ./configs:/app/configs:ro
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq app.workers.settings.WorkerSettings

  # ── Frontend (React + Vite) ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: efi_frontend
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - VITE_DEMO_MODE=${DEMO_MODE:-true}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
